# cargo-deny: licences, advisories, bans and sources. Owned by stream 0.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Unmaintained, not a vulnerability. Reaches only the desktop shell (its own workspace), via
  # glib-macros 0.18 (gtk-rs GTK3), which Tauri 2 needs on Linux. A build-time proc macro with no
  # upgrade path until Tauri moves to GTK4. Revisit when Tauri does.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros 0.18 (Tauri 2 on Linux), build-time only, no upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
# webpki-root-certs is Mozilla's root-certificate list as data (via rustls-platform-verifier, for the
# updater), under CDLA-Permissive-2.0: a permissive data licence compatible with Apache-2.0.
# Allowed for that crate only, not project-wide.
exceptions = [
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

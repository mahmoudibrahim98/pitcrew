[package]
name = "pitcrew-benches"
description = "Benchmarks that check PitCrew's performance budgets. Owned by stream P."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
bench = false

[[bin]]
name = "pitcrew-bench-report"
path = "src/bin/report.rs"
bench = false

[[bin]]
name = "pitcrew-bench-scale"
path = "src/bin/scale.rs"
bench = false

[dependencies]
pitcrew-protocol.workspace = true
pitcrew-interfaces.workspace = true
pitcrew-fixtures.workspace = true
pitcrew-ingest.workspace = true
pitcrew-runtime.workspace = true
pitcrew-store.workspace = true
pitcrew-api.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "transcripts"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "control"
harness = false

[[bench]]
name = "stream"
harness = false

[lints]
workspace = true

[package]
name = "pitcrew-ingest"
description = "Transcript parsers for Claude Code, Codex and OpenCode (incremental, by offset), and the machine scan. Owned by stream A."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
pitcrew-protocol.workspace = true
pitcrew-interfaces.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rusqlite.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` and `O_NONBLOCK` when opening a transcript (`src/open.rs`), without unsafe code.
# The version `pitcrew-auth` and `pitcrew-cli` already use.
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
pitcrew-fixtures.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true

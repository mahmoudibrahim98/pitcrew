[package]
name = "pitcrew-trust"
description = "The check every program PitCrew launches passes (pitcrewd, pitcrew-ptyd), and on Windows the one copy of its pipe security: SIDs, owners, DACLs, labels, descriptors. Owned by stream 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[target.'cfg(unix)'.dependencies]
# The effective uid, without unsafe code. The version pitcrew-auth, pitcrew-runtime and the
# desktop already use.
rustix = { version = "=1.1.5", features = ["process"] }

[target.'cfg(windows)'.dependencies]
# SIDs, tokens, owners, DACLs, labels and security descriptors (`windows`). The version tokio
# already uses.
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
# `ServerOptions`, for a pipe made with a descriptor (`SecurityDescriptor::create_pipe`): only a
# constructor, nothing async. Every caller already builds tokio with `net`.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
tokio = { workspace = true, features = ["net", "rt"] }

[lints]
workspace = true

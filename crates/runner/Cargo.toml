[package]
name = "pitcrew-runner"
description = "Runner service: watchers, session linking, derived events to the hub, file API. Owned by stream D."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
pitcrew-protocol.workspace = true
pitcrew-interfaces.workspace = true
# The in-process hub link: the API's hook and terminal seams, and the hub's store.
pitcrew-api.workspace = true
pitcrew-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
rusqlite.workspace = true
notify.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[target.'cfg(unix)'.dependencies]
# flock for the state directory's single-instance lock, without unsafe code. The version tempfile
# (and pitcrew-auth) already use, so nothing new enters the lockfile.
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
pitcrew-ingest.workspace = true
pitcrew-fixtures.workspace = true
pitcrew-auth.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
# The API's terminal tests, run against RunnerTerminals.
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
# Blocking WebSocket client, as in pitcrew-api's tests. The version axum's `ws` feature uses.
tungstenite = "=0.29.0"

[lints]
workspace = true

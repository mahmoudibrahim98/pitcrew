[package]
name = "pitcrew-runner"
description = "Runner service: watchers, session linking, derived events to the hub, file API. Owned by stream D."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
pitcrew-protocol.workspace = true
pitcrew-interfaces.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
rusqlite.workspace = true
notify.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# flock for the state directory's single-instance lock, without unsafe code. The version tempfile
# (and pitcrew-auth) already use, so nothing new enters the lockfile.
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
pitcrew-ingest.workspace = true
pitcrew-fixtures.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

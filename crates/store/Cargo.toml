[package]
name = "pitcrew-store"
description = "SQLite store: migrations, the append-only event log, projections, and NFS-safe mode. Owned by stream C."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
pitcrew-protocol.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
# `statfs` for filesystem detection, `uname` for the lease's host name, and a liveness check
# (`kill(pid, 0)`) for the same-host pid-gone takeover, all without unsafe code. The exact version
# `pitcrew-auth` already pins; we add the `system` feature it does not need (for `uname`).
rustix = { version = "=1.1.5", features = ["fs", "process", "system"] }

[dev-dependencies]
pitcrew-fixtures.workspace = true
tempfile.workspace = true

[lints]
workspace = true

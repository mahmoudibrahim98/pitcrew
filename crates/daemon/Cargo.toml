[package]
name = "pitcrew-daemon"
description = "pitcrewd: the composition root that wires hub, runner and API together. Owned by stream 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "pitcrewd"
path = "src/main.rs"

[dependencies]
pitcrew-protocol.workspace = true
pitcrew-api.workspace = true
pitcrew-auth.workspace = true
pitcrew-store.workspace = true
pitcrew-hub-work.workspace = true
# Only to tell the hub's refusals of the back office's actions (final) from its internal failures
# (tried again): `run_office` reports both as `pitcrew_office::ApplyError`.
pitcrew-office.workspace = true
pitcrew-fixtures.workspace = true
# The runner in this process (ADR-0009's solo case), the transcript adapters it watches with, and
# the runtime and source traits it takes.
pitcrew-runner.workspace = true
pitcrew-ingest.workspace = true
pitcrew-interfaces.workspace = true
# The runner's terminals: `TmuxRuntime` on PitCrew's private tmux server, and its detection.
pitcrew-runtime.workspace = true
# `pitcrewd connect`: the stdio bridge a remote helper is reached through
# (`pitcrew_remote::bridge::main`).
pitcrew-remote.workspace = true
# `pitcrewd init`: the `pitcrew` CLI's blocking client (its transport checks, HTTP and errors) for
# `POST /v1/setup`. Not in the root's `[workspace.dependencies]`, hence the path.
pitcrew-cli = { path = "../cli" }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
# `process`, `io-util` and `macros`: the machine check's and the agents' status commands, run
# briefly and bounded (`machine_setup::tools`). Features the workspace already builds tokio with.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# The tmux socket's directory name: 8 hex digits of the state directory's sha256.
sha2.workspace = true
# `Stream`, for the machine scan's streamed answer (`axum::body::Body::from_stream`). Already in the
# lockfile through axum, at this version; not in the root's `[workspace.dependencies]`.
futures-core = "=0.3.34"
# GitHub and Jira, read-only (`integrations`): the sync crates, hub-work's `SyncCommands`, and
# `check_trusted` for the `gh` the hub runs.
pitcrew-sync-github.workspace = true
pitcrew-sync-jira.workspace = true
pitcrew-trust.workspace = true
thiserror.workspace = true
bytes.workspace = true
# The sync's HTTPS transport (`integrations/http.rs`), the dependency decision the sync crates left
# to the integrator: hyper's HTTP/1 client (hyper and hyper-util are already in the tree through
# axum) over rustls with the `ring` provider (no aws-lc and no C toolchain beyond ring's own) and
# this machine's own trusted certificates (rustls-native-certs). No HTTP/2. An `http://` proxy from
# `HTTPS_PROXY` is reached with CONNECT (`integrations/proxy.rs`): its credentials go in
# `Proxy-Authorization` with base64 (the workspace's), decoded from the URL with percent-encoding
# (already in the lockfile through url, at this version).
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = "=0.1.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
# URL parsing for the transport and the connection checks; the version the sync crates use.
url = "~2.5"
base64.workspace = true
percent-encoding = "=2.3.2"

[target.'cfg(unix)'.dependencies]
# The tmux socket's lock (flock, O_NOFOLLOW), without unsafe code; free disk space (`statvfs`)
# and stopping a timed-out tool's process group (`process`) for the machine check. The version
# pitcrew-auth, pitcrew-runner and pitcrew-runtime already use, so nothing new enters the lockfile.
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
# `oneshot`, to drive a route and its layers in unit tests (as pitcrew-api's and hub-work's tests do).
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[package]
name = "pitcrew-api"
description = "HTTP and WebSocket API over a unix socket or named pipe; composes every crate's routes. Owned by stream H."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
pitcrew-protocol.workspace = true
pitcrew-auth.workspace = true
pitcrew-interfaces.workspace = true
# `StoreSource` (feature `store`, on by default). Crates that only need `client` can turn it off
# and skip SQLite.
pitcrew-store = { workspace = true, optional = true }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
# Only to recognise the size-limit error axum's WebSocket wraps (and close with 1009). It must be
# the exact version axum's `ws` feature uses, or the error's type would not match; adds no code.
tungstenite = { version = "=0.30.0", default-features = false }

[features]
default = ["store"]
store = ["dep:pitcrew-store"]

[target.'cfg(windows)'.dependencies]
# The named pipe's security descriptor, and its owner for the client's check: the one copy of
# that Win32 code, shared with the askpass and pitcrew-ptyd pipes.
pitcrew-trust.workspace = true

[dev-dependencies]
pitcrew-fixtures.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync"] }
# Blocking WebSocket client for the subprotocol test. The version axum's `ws` feature already uses.
tungstenite = "=0.30.0"
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

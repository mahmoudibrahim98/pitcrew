[package]
name = "pitcrew-cli"
description = "pitcrew: the agent-facing CLI and the hook entry point. Owned by stream I."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
name = "pitcrew_cli"
path = "src/lib.rs"

[[bin]]
name = "pitcrew"
path = "src/main.rs"

[dependencies]
pitcrew-protocol.workspace = true
# The checks a client makes before trusting a daemon with a token (`pitcrew_api::client`).
pitcrew-api.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# Format-preserving TOML editing for `pitcrew hooks install` on Codex's config.toml (keeps the
# user's comments and layout). MIT OR Apache-2.0; not yet in the workspace table (stream I only).
# The integrator should consider moving this to the root `[workspace.dependencies]` if another
# stream needs it too.
toml_edit = "=0.25.15"

[target.'cfg(unix)'.dependencies]
pitcrew-auth.workspace = true
# O_NOFOLLOW for the token file and SO_PEERCRED for the socket, without unsafe code. The version
# pitcrew-auth already uses.
rustix = { version = "=1.1.5", features = ["fs", "net", "process"] }

[target.'cfg(windows)'.dependencies]
# Safe suspended launch into a kill-on-close Job object; avoids new unsafe code here.
# MIT OR Apache-2.0, pinned for the CLI only.
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }

[dev-dependencies]
# A home of their own for the binaries the tests start (`pitcrew_fixtures::homes`).
pitcrew-fixtures.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The transport test serves on the daemon's own pipe listener (`pitcrew_api::NamedPipe`), through
# axum's `Listener` trait. The workspace's versions.
axum.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }

[lints]
workspace = true

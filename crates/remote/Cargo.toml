[package]
name = "pitcrew-remote"
description = "Remote machines: SSH connection manager, helper deployment, launchers (direct, tmux, systemd, SLURM), tunnels, reconnect. Owned by stream J."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[[bin]]
name = "pitcrew-askpass"
path = "src/bin/pitcrew-askpass.rs"

[[test]]
# Its own `main`: the test binary doubles as the fake `ssh` it drives.
name = "fake_ssh"
path = "tests/fake_ssh.rs"
harness = false

[[test]]
# Likewise: the fake `ssh`, `pitcrewd` and hash tools are this binary.
name = "deploy"
path = "tests/deploy.rs"
harness = false

[dependencies]
pitcrew-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `macros` for `select!` and `try_join!`.
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
# OS randomness for askpass keys and nonces. Already in the lockfile through `ulid`.
getrandom = "=0.4.3"
# Reading users' site recipes (~/.pitcrew/sites/*.toml) strictly, key by key. The version
# stream I's pitcrew-cli already uses (MIT OR Apache-2.0); parsing only.
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
# Effective uid, process groups, parent pid and pidfds without unsafe code; for the stdio
# bridge, `poll` and pointing stdout at /dev/null; `flock` for the tunnel's directory locks.
# The version tempfile already uses.
rustix = { version = "=1.1.5", features = ["event", "fs", "process", "stdio"] }

[target.'cfg(windows)'.dependencies]
# The askpass pipe's security descriptor (src/pipe_security.rs): the one copy of that Win32 code,
# shared with the API's and pitcrew-ptyd's pipes.
pitcrew-trust.workspace = true
# Job Objects for ssh (src/job.rs) and the pipe client's security flags. The version tokio
# already uses.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
# `temp::short_tempdir`, for tests whose sockets must fit macOS's limit.
pitcrew-fixtures.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

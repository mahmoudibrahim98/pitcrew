[package]
name = "pitcrew-hub-work"
description = "Hub work model: projects, workstreams, tasks and subtasks, asks, dispatch and queue, roles, orders, personas, teams. Owned by stream E."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
tempfile.workspace = true
pitcrew-protocol.workspace = true
pitcrew-store.workspace = true
# The seed command imports a `DemoWorkspace`.
pitcrew-fixtures.workspace = true
# The back office acts on the hub through `pitcrew_office::Commands`; its brief proposals are
# recap's `BriefProposal`.
pitcrew-office.workspace = true
pitcrew-recap.workspace = true
# The back office's event ids are derived from its run log (a SHA-256 of the log, the revision and
# the action's place), so re-running a range appends nothing twice.
sha2.workspace = true
ulid.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

# Owned by stream 0. Dependabot branches may only touch manifests, lockfiles and workflows
# (see docs/build/ownership.json → "dependabot").
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    ignore:
      # typescript-eslint 8.71.0 (latest) supports TypeScript <6.1.0; watch for a
      # released parser/estree version supporting the TypeScript 7 native API.
      - dependency-name: typescript
        versions: ["7.x"]
    schedule:
      interval: weekly
    groups:
      js-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

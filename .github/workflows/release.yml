# Owned by stream P. On a `v*` tag: builds pitcrewd, pitcrew, pitcrew-ptyd and pitcrew-askpass
# for every platform, then the desktop installers from those same binaries (Linux .deb and
# AppImage, macOS DMG, Windows NSIS), checks the installers, writes SHA256SUMS and SBOMs, attests
# build provenance and opens a DRAFT GitHub release. A manual run (workflow_dispatch) builds,
# checks and uploads the artefacts only: no attestation, no release, nothing published (the
# `attest` and `release` jobs run only for a pushed `v*` tag).
#
# Actions are pinned by commit SHA (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`); tools are
# pinned by version (cargo install --locked) or by hash (Zig: packaging/zig-requirements.txt).
# Each job gets only the permissions it needs; the build jobs, which run third-party build
# scripts, get none beyond reading the repository. No caches, so a release never builds from a
# poisoned cache. Signing steps are placeholders (packaging/sign.sh): each reads its secrets by
# name and is skipped when they are absent. See packaging/README.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      measure_only:
        description: Compare existing installer artifacts without building or publishing
        type: boolean
        default: false
      before_run:
        description: Baseline release workflow run ID (measure_only)
        type: string
      after_run:
        description: Changed release workflow run ID (measure_only)
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  # The Tauri CLI that bundles the desktop: the same major.minor as the desktop's tauri crate (and
  # the UI's @tauri-apps/api), as docs/build/contracts/desktop-gateway.md requires.
  TAURI_CLI_VERSION: "2.12.1"
  # centos:7 (glibc 2.17), by digest: the static helper must run on an old Linux, offline.
  OLD_GLIBC_IMAGE: docker.io/library/centos:7@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4

jobs:
  build:
    if: ${{ !inputs.measure_only }}
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rust-targets: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            rust-targets: aarch64-unknown-linux-musl
            zig: true
          - os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            zig: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            zig: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every hosted runner; the channel comes from rust-toolchain.toml.
      - name: Rust
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "::error::no channel in rust-toolchain.toml"; exit 1; fi
          read -r -a targets <<<"$RUST_TARGETS"
          rustup toolchain install "$channel" --profile minimal
          rustup target add --toolchain "$channel" "${targets[@]}"
          rustc --version

      # Zig from PyPI in a venv, pinned by hash; cargo-zigbuild runs `python3 -m ziglang`.
      - name: Zig and cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r packaging/zig-requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          flags=()
          if [ "$ZIG" = true ]; then flags+=(--zig); fi
          bash packaging/build-release.sh --out dist ${flags[@]+"${flags[@]}"} "$TARGET"

      - name: The helper is static
        if: matrix.zig
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for bin in pitcrewd pitcrew pitcrew-ptyd pitcrew-askpass; do
            file "dist/$bin-$TARGET" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          done

      - name: The helper runs on an old glibc with no network
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for bin in pitcrewd pitcrew-ptyd; do
            docker run --rm --network none -v "$PWD/dist:/dist:ro" "$OLD_GLIBC_IMAGE" \
              "/dist/$bin-$TARGET" --version
          done

      - name: Sign (macOS placeholder)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/sign.sh macos dist

      - name: Sign (Windows placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash packaging/sign.sh windows dist

      # Only the binaries: the release job writes one manifest over everything.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/pitcrew*
          if-no-files-found: error
          retention-days: 7

  # The desktop installers, from the build job's binaries: pitcrewd, pitcrew-ptyd and
  # pitcrew-askpass next to the app (on Linux the static x86_64 musl builds), the three helpers in
  # helpers/, and their checksums compiled into the app. See packaging/README.md.
  desktop:
    name: Desktop (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      # A release stops at the first failed installer; a manual run builds them all, so one run
      # shows every OS's result.
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then echo "::error::no channel in rust-toolchain.toml"; exit 1; fi
          read -r -a targets <<<"$RUST_TARGETS"
          rustup toolchain install "$channel" --profile minimal
          rustup target add --toolchain "$channel" "${targets[@]}"
          rustc --version

      # The libraries Tauri links (as in ci.yml), and what the checks use: unsquashfs for the
      # AppImage's owners, desktop-file-validate, and Xvfb to start the app.
      - name: Linux libraries and tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            squashfs-tools desktop-file-utils rpm rpm2cpio cpio libarchive-tools xvfb xauth xz-utils

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Release inputs must not come from a package cache populated by another workflow.
          package-manager-cache: false

      # The UI the app serves (apps/ui/dist). pnpm comes from the root package.json, by corepack.
      - name: The UI
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @pitcrew/ui build

      - name: Tauri CLI
        shell: bash
        run: cargo install tauri-cli --locked --version "${TAURI_CLI_VERSION}"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      # Tauri's bundler signs while it bundles (the app before its DMG; the programs, then the
      # installer, on Windows), so these placeholders stand before it. See packaging/README.md.
      - name: Sign the app (macOS placeholder)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/sign.sh macos dist

      - name: Sign the app (Windows placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash packaging/sign.sh windows dist

      - name: XZ resource encoder
        if: runner.os == 'macOS'
        run: brew install xz

      - name: Bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash packaging/desktop/build.sh --dist dist --out dist/desktop "$TARGET"

      # Sizes against the 25 MB budget (a warning when over), the layout, the helpers' sha256
      # against the compiled manifest, owners and modes, pitcrew:// and, on Windows, a real
      # install, upgrade and removal.
      - name: Check the installers
        shell: bash
        run: bash packaging/desktop/check.sh --manifest dist/desktop-stage/helpers/manifest.json dist/desktop/*

      - name: Largest installer payload files
        shell: bash
        run: bash packaging/desktop/contents.sh dist/desktop/* | tee -a "$GITHUB_STEP_SUMMARY"

      # The app started once, as installed, in a throwaway home: its own pitcrewd and askpass.
      - name: Start the installed app (Linux)
        if: runner.os == 'Linux'
        env:
          # No FUSE needed: the AppImage runs from a folder it extracts itself.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y ./dist/desktop/*.deb
          bash packaging/desktop/smoke.sh /usr/bin/pitcrew-desktop
          bash packaging/desktop/smoke.sh dist/desktop/*.AppImage

      - name: Start the app (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/desktop/smoke.sh dist/desktop/*.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Checksums and SBOM
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The packaging scripts pass their tests
        run: bash packaging/test.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: SBOM
        run: |
          cargo install cargo-cyclonedx --locked --version "${CARGO_CYCLONEDX_VERSION}"
          bash packaging/sbom.sh dist
      - name: SHA256SUMS
        run: bash packaging/sha256sums.sh dist
      - name: Sign SHA256SUMS (placeholder)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash packaging/sign.sh checksums dist
      - name: Verify against SHA256SUMS
        run: bash packaging/verify.sh dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  measure:
    name: Measure existing installers (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' && inputs.measure_only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: universal-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate comparison inputs
        shell: bash
        env:
          BEFORE_RUN: ${{ inputs.before_run }}
          AFTER_RUN: ${{ inputs.after_run }}
        run: |
          if [[ ! "$BEFORE_RUN" =~ ^[1-9][0-9]*$ || ! "$AFTER_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::before_run and after_run must be release workflow run IDs"
            exit 1
          fi
      - name: Linux extraction tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools rpm rpm2cpio cpio libarchive-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-${{ matrix.target }}
          run-id: ${{ inputs.before_run }}
          github-token: ${{ github.token }}
          path: before
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-${{ matrix.target }}
          run-id: ${{ inputs.after_run }}
          github-token: ${{ github.token }}
          path: after
      # Summaries are convenient in the UI; annotations also expose exact measurements through
      # GitHub's API when the reader cannot access the log/artifact storage redirect hosts.
      - name: Report exact sizes and largest files
        shell: bash
        run: |
          set -euo pipefail
          for comparison in before after; do
            # Artifact downloads retain bytes but not executable permission bits.
            for image in "$comparison"/*.AppImage; do
              [ ! -f "$image" ] || chmod 0755 "$image"
            done
            report=$(bash packaging/desktop/contents.sh "$comparison"/*)
            printf '## %s\n\n%s\n' "$comparison" "$report" >> "$GITHUB_STEP_SUMMARY"
            escaped=${report//'%'/'%25'}
            escaped=${escaped//$'\r'/'%0D'}
            escaped=${escaped//$'\n'/'%0A'}
            echo "::notice title=Installer payload ($comparison)::$escaped"

  attest:
    name: Attest build provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Before the download: checkout cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Verify against SHA256SUMS
        run: bash packaging/verify.sh dist
      # One attestation whose subjects are every file listed in SHA256SUMS.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Verify against SHA256SUMS
        run: bash packaging/verify.sh dist
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "PitCrew $TAG")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" "${flags[@]}"

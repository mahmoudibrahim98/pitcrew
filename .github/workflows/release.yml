# Owned by stream P. Builds pitcrewd and pitcrew for every platform on a `v*` tag, then writes
# SHA256SUMS and SBOMs, attests build provenance and opens a DRAFT GitHub release. A manual run
# (workflow_dispatch) builds and uploads the artefacts only: no attestation, no release.
#
# Actions are pinned by commit SHA (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`); tools are
# pinned by version (cargo install --locked) or by hash (Zig: packaging/zig-requirements.txt).
# Each job gets only the permissions it needs; the build jobs, which run third-party build
# scripts, get none beyond reading the repository. No caches, so a release never builds from a
# poisoned cache. Signing steps are placeholders (packaging/sign.sh): each reads its secrets by
# name and is skipped when they are absent. See packaging/README.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  # centos:7 (glibc 2.17), by digest: the static helper must run on an old Linux, offline.
  OLD_GLIBC_IMAGE: docker.io/library/centos:7@sha256:be65f488b7764ad3638f236b7b515b3678369a5124c47b8d32916d6487418ea4

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rust-targets: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            rust-targets: aarch64-unknown-linux-musl
            zig: true
          - os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            zig: false
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            zig: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every hosted runner. The channel matches rust-toolchain.toml.
      - name: Rust
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          read -r -a targets <<<"$RUST_TARGETS"
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "${targets[@]}"
          rustc --version

      # Zig from PyPI in a venv, pinned by hash; cargo-zigbuild runs `python3 -m ziglang`.
      - name: Zig and cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r packaging/zig-requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version "${CARGO_ZIGBUILD_VERSION}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          flags=()
          if [ "$ZIG" = true ]; then flags+=(--zig); fi
          bash packaging/build-release.sh --out dist ${flags[@]+"${flags[@]}"} "$TARGET"

      - name: The helper is static
        if: matrix.zig
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for bin in pitcrewd pitcrew; do
            file "dist/$bin-$TARGET" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          done

      - name: The helper runs on an old glibc with no network
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --network none -v "$PWD/dist:/dist:ro" "$OLD_GLIBC_IMAGE" \
            "/dist/pitcrewd-$TARGET" --version

      - name: Sign (macOS placeholder)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/sign.sh macos dist

      - name: Sign (Windows placeholder)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash packaging/sign.sh windows dist

      # Only the binaries: the release job writes one manifest over everything.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/pitcrew*
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Checksums and SBOM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: SBOM
        run: |
          cargo install cargo-cyclonedx --locked --version "${CARGO_CYCLONEDX_VERSION}"
          bash packaging/sbom.sh dist
      - name: SHA256SUMS
        run: bash packaging/sha256sums.sh dist
      - name: Sign SHA256SUMS (placeholder)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash packaging/sign.sh checksums dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest build provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      # One attestation whose subjects are every file listed in SHA256SUMS.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "PitCrew $TAG")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$REPO" "${flags[@]}"

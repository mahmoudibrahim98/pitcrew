name: Protocol TypeScript

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: protocol-ts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  bindings:
    name: Generated protocol types and JSON fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: cargo test -p pitcrew-protocol --features ts --locked
      - run: cargo clippy -p pitcrew-protocol --all-targets --features ts --locked -- -D warnings
      - run: corepack pnpm --filter @pitcrew/protocol-ts typecheck
      - name: Bindings and fixtures are current, including new files
        run: |
          git diff --exit-code -- packages/protocol-ts
          test -z "$(git status --porcelain --untracked-files=all -- packages/protocol-ts)"

# Owned by stream 0 (proposed by stream Q). Runs every fuzz target for 5 minutes each night.
# Actions are pinned by commit SHA; Dependabot keeps them current.
name: Fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: claude_parse_line, dict: claude }
          - { target: codex_parse_line, dict: codex }
          - { target: adapter_read, dict: claude }
          - { target: adapter_cursor, dict: claude }
          - { target: tmux_control, dict: tmux }
          - { target: runner_decode_line, dict: protocol }
          - { target: api_json, dict: protocol }
          - { target: api_request, dict: http }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          key: ${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed from the fixtures
        run: python3 fuzz/seed.py
      - name: Fuzz for 5 minutes
        env:
          TARGET: ${{ matrix.target }}
          DICT: ${{ matrix.dict }}
        run: >-
          cargo +nightly fuzz run "$TARGET" --
          -max_total_time=300 -timeout=10 -rss_limit_mb=2048
          -dict="fuzz/dict/$DICT.dict" -print_final_stats=1
      - name: Minimise the corpus
        if: success()
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +nightly fuzz cmin "$TARGET"
      - name: Save the corpus
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 30

  deny:
    name: Fuzz dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check
          arguments: --config fuzz/deny.toml

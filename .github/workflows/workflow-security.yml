# Owned by stream 0. Offline analysis needs no credentials and checks all workflows.
name: Workflow security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the exact released linter
        run: python3 -m pip install --disable-pip-version-check zizmor==1.30.1
      - name: Audit workflows
        run: zizmor --offline --strict-collection .github/workflows/

# Owned by stream Q. A cargo-fuzz project with its own workspace: the root workspace excludes
# `fuzz/`, so stable builds never see it. Needs a nightly toolchain:
#
#   python3 fuzz/seed.py                 # seed fuzz/corpus/<target>/ from crates/fixtures
#   cargo +nightly fuzz run <target> -- -dict=fuzz/dict/<name>.dict -max_total_time=60
#   cargo +nightly fuzz run <target> fuzz/regressions/<target>/<file>   # a finding's input
#
# Inputs in fuzz/regressions/<target>/ named `open-*` reproduce findings not fixed yet; the others
# are fixed findings and must pass.
#
# Targets and what each checks are listed in docs/security/threat-model.md ("Fuzzing").

[package]
name = "pitcrew-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
pitcrew-protocol = { path = "../crates/protocol" }
pitcrew-interfaces = { path = "../crates/interfaces" }
pitcrew-ingest = { path = "../crates/ingest" }
pitcrew-runtime = { path = "../crates/runtime" }
pitcrew-api = { path = "../crates/api" }
pitcrew-auth = { path = "../crates/auth" }
pitcrew-remote = { path = "../crates/remote" }
pitcrew-sync-github = { path = "../crates/sync-github" }
pitcrew-sync-jira = { path = "../crates/sync-jira" }
pitcrew-cli = { path = "../crates/cli" }
pitcrew-store = { path = "../crates/store" }
pitcrew-recap = { path = "../crates/recap" }
pitcrew-hub-work = { path = "../crates/hub-work" }
pitcrew-fixtures = { path = "../crates/fixtures" }
serde = "1"
# `float_roundtrip` makes parse(print(x)) == x for every f64, so the round-trip checks cannot
# fail on the last bit of a float. It only changes float parsing.
serde_json = { version = "1", features = ["float_roundtrip"] }
axum = "0.8"
tokio = { version = "1.53", features = ["rt", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
# The WebSocket client for `api_terminal`; the version axum's `ws` feature already uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Writes the OpenCode stores for `opencode_store`; the version (and bundled SQLite) ingest uses.
rusqlite = { version = "0.40", features = ["bundled"] }
# Reads TOML for `cli_hooks`; the exact version the CLI edits it with.
toml_edit = "=0.25.15"
# The WHATWG URL parser, as HTTP clients built on it (reqwest, ureq) resolve a URL: the oracle
# for "a followed link never leaves the API base" in `github_sync`.
url = "2"

[profile.release]
debug = 1

[[bin]]
name = "claude_parse_line"
path = "fuzz_targets/claude_parse_line.rs"
test = false
doc = false
bench = false


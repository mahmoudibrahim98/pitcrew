# cargo-deny for the fuzz workspace, which the root `deny.toml` does not see. Owned by stream Q.
# The same policy as the root file, plus one exception: libFuzzer (vendored by `libfuzzer-sys`)
# is under the NCSA licence. The fuzz crate is a development tool and is never shipped.
#
#   cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
exceptions = [{ allow = ["NCSA"], crate = "libfuzzer-sys" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
